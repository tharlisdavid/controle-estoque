<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Estoque Interativo</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

  <div class="container">
    <h1>📦 Cadastro de Produto</h1>

    <form id="produtoForm" class="card">
      <div class="form-group">
        <label for="descricao">Descrição</label>
        <div class="input-icon">
          <i data-lucide="package"></i>
          <input type="text" id="descricao" placeholder="Ex: Cimento CP II" required>
        </div>
      </div>

      <div class="form-group">
        <label for="quantidade">Quantidade</label>
        <div class="input-icon">
          <i data-lucide="layers"></i>
          <input type="number" id="quantidade" placeholder="Ex: 20" required>
        </div>
      </div>

      <div class="form-group">
        <label for="marca">Marca</label>
        <div class="input-icon">
          <i data-lucide="tag"></i>
          <input type="text" id="marca" placeholder="Ex: Votoran" required>
        </div>
      </div>

      <div class="form-group">
        <label for="vencimento">Vencimento</label>
        <div class="input-icon">
          <i data-lucide="calendar"></i>
          <input type="date" id="vencimento" required>
        </div>
      </div>

      <div class="form-group">
        <label for="codigo">Código / QR Code</label>
        <div class="input-icon">
          <i data-lucide="barcode"></i>
          <input type="text" id="codigo" placeholder="Escaneie com a câmera" readonly>
        </div>
      </div>

      <button type="button" onclick="enviarProduto()" id="btnEnviar">
        <i data-lucide="send"></i>
        Cadastrar Produto
      </button>
    </form>

    <div class="card scanner">
      <h3>📷 Escaneie Código</h3>
      <div id="reader"></div>
    </div>
  </div>

  <script src="https://unpkg.com/html5-qrcode"></script>
  <script src="script.js"></script>
  <script>
    lucide.createIcons();
  </script>
</body>
</html>
